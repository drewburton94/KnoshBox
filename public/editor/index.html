<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Knosh Box Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--red:#C8261F;--tint:#F8E1DE;--ink:#171512;--bg:#F2EEE6;--card:#FBF8F1;--muted:#57524A;--line:#d9d2c4;--ok:#1d7a3a;
  --sans:'Bricolage Grotesque',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}

/* lock screen */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.lock-card{width:100%;max-width:420px;border:3px solid var(--ink);border-radius:28px;background:var(--card);box-shadow:8px 8px 0 var(--red);padding:32px;display:flex;flex-direction:column;gap:16px}
.lock-card h1{margin:0;font-size:36px;letter-spacing:-0.04em;line-height:1}
.lock-card p{margin:0;color:var(--muted);line-height:1.5}

label.f{display:flex;flex-direction:column;gap:6px}
.lab{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
input[type=text],input[type=password],textarea{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(200,38,31,.22)}
textarea{resize:vertical;min-height:84px;line-height:1.45}
.btn{border:3px solid var(--ink);border-radius:99px;background:var(--red);color:#fff;font-weight:800;font-size:16px;padding:12px 22px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);font-size:14px;padding:8px 14px;box-shadow:0 3px 0 var(--ink)}
.err{margin:0;padding:10px 14px;border:2.5px solid var(--ink);border-radius:12px;background:var(--tint);font-size:14px}

/* editor */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;background:var(--ink);color:var(--bg)}
.bar strong{font-size:20px;letter-spacing:-0.03em;margin-right:auto}
.bar .status{font-family:var(--mono);font-size:12px}
.bar .status.ok{color:#8fe0a8}
.bar .status.dirty{color:#f5d76e}
.bar .btn{padding:9px 20px;font-size:15px;box-shadow:0 4px 0 #000;border-color:var(--bg)}
.layout{display:grid;grid-template-columns:minmax(320px,460px) minmax(0,1fr);gap:20px;padding:20px;align-items:start}
.fields{display:flex;flex-direction:column;gap:12px}
details{border:2.5px solid var(--ink);border-radius:18px;background:var(--card);overflow:hidden}
summary{cursor:pointer;padding:13px 16px;font-weight:800;font-size:18px;letter-spacing:-0.02em;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';font-family:var(--mono);font-weight:400}
details[open]>summary::after{content:'–'}
summary .n{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--red);margin-left:auto;margin-right:6px}
.group{display:flex;flex-direction:column;gap:14px;padding:4px 16px 16px}
.field{display:flex;flex-direction:column;gap:6px}
.field-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.reset{background:none;border:0;padding:0;font-family:var(--mono);font-size:11px;text-decoration:underline;color:var(--muted)}
.field.changed .lab::after{content:' · edited';color:var(--red)}
.hint{font-family:var(--mono);font-size:11px;color:var(--muted)}
.hint.bad{color:var(--red)}
.hint.good{color:var(--ok)}
.imgrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.thumb{width:96px;height:72px;object-fit:contain;border:2px solid var(--ink);border-radius:10px;background:#fff}
.preview{position:sticky;top:64px;display:flex;flex-direction:column;gap:10px}
.pv-top{display:flex;gap:8px;align-items:center}
.pv-top .mono{font-size:12px;margin-right:auto}
.frame{border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:#fff;box-shadow:6px 6px 0 var(--red);margin:0 auto;width:100%;transition:width .25s}
.frame.phone{width:390px;max-width:100%}
iframe{display:block;width:100%;height:calc(100vh - 170px);min-height:480px;border:0}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.preview{position:static}iframe{height:70vh}}
</style>
</head>
<body>

<div class="lock" id="lock">
  <form class="lock-card" id="lockForm">
    <h1>Knosh Box editor</h1>
    <p>Enter the editing password to change the website’s text, video and photos.</p>
    <label class="f"><span class="lab">Password</span><input type="password" id="pw" autocomplete="current-password" required autofocus></label>
    <p class="err" id="lockErr" role="alert" hidden></p>
    <button class="btn" type="submit" id="unlock">Unlock</button>
  </form>
</div>

<div id="app" hidden>
  <div class="bar">
    <strong>Knosh Box editor</strong>
    <span class="status" id="status" role="status" aria-live="polite">No changes</span>
    <button class="btn" id="save" type="button" disabled>Save changes</button>
  </div>
  <div class="layout">
    <div class="fields" id="fields"></div>
    <div class="preview">
      <div class="pv-top"><span class="mono">Live preview. Changes go live when you save.</span>
        <button class="btn ghost" type="button" data-w="desktop">Desktop</button>
        <button class="btn ghost" type="button" data-w="phone">Phone</button></div>
      <div class="frame" id="frame"><iframe id="pv" src="/" title="Website preview"></iframe></div>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var token = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');
  var password = '';
  var fields = [], defaults = {}, saved = {}, values = {};

  function headers(extra) {
    var h = { 'X-Edit-Token': token, 'X-Edit-Password': password };
    for (var k in extra) h[k] = extra[k];
    return h;
  }
  function api(path, body, extra) {
    return fetch(path, { method: 'POST', headers: headers(extra || { 'Content-Type': 'application/json' }), body: body })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong.'); return j; }); });
  }

  /* ---- unlock ---- */
  $('#lockForm').addEventListener('submit', function (e) {
    e.preventDefault();
    password = $('#pw').value; $('#lockErr').hidden = true; $('#unlock').disabled = true;
    api('/api/auth', '{}').then(load).catch(function (err) {
      $('#lockErr').textContent = err.message; $('#lockErr').hidden = false;
    }).then(function () { $('#unlock').disabled = false; });
  });

  /* ---- load defaults from the live page's HTML, and current values from the API ---- */
  function load() {
    return Promise.all([
      fetch('/', { cache: 'no-store' }).then(function (r) { return r.text(); }),
      fetch('/api/content', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : { values: {} }; }).catch(function () { return { values: {} }; })
    ]).then(function (res) {
      var doc = new DOMParser().parseFromString(res[0], 'text/html');
      var seen = {};
      [].forEach.call(doc.querySelectorAll('[data-edit]'), function (el) {
        var key = el.getAttribute('data-edit'); if (seen[key]) return; seen[key] = 1;
        var type = el.getAttribute('data-type') || 'text', def;
        if (type === 'image') def = el.getAttribute('src') || '';
        else if (type === 'video') def = '';
        else if (type === 'lines') def = [].map.call(el.childNodes, function (n) { return n.nodeName === 'BR' ? '\n' : n.textContent; }).join('');
        else def = el.textContent;
        defaults[key] = def;
        fields.push({ key: key, label: el.getAttribute('data-label') || key, group: el.getAttribute('data-group') || 'Other', type: type });
      });
      saved = res[1].values || {};
      values = JSON.parse(JSON.stringify(saved));
      $('#lock').hidden = true; $('#app').hidden = false;
      render();
    });
  }

  var inputs = {};
  function render() {
    var box = $('#fields'), groups = {}, order = [];
    fields.forEach(function (f) { if (!groups[f.group]) { groups[f.group] = []; order.push(f.group); } groups[f.group].push(f); });
    order.forEach(function (g, gi) {
      var det = document.createElement('details'); if (gi === 0) det.open = true;
      var sum = document.createElement('summary'); sum.textContent = g;
      var cnt = document.createElement('span'); cnt.className = 'n'; cnt.id = 'n-' + gi; sum.insertBefore(cnt, null);
      det.appendChild(sum);
      var body = document.createElement('div'); body.className = 'group';
      groups[g].forEach(function (f) { body.appendChild(buildField(f)); });
      det.appendChild(body); box.appendChild(det);
      det.dataset.gi = gi; det._fields = groups[g];
    });
    refresh();
  }

  function cur(key) { return typeof values[key] === 'string' ? values[key] : defaults[key]; }

  function buildField(f) {
    var wrap = document.createElement('div'); wrap.className = 'field'; wrap.id = 'f-' + f.key;
    var head = document.createElement('div'); head.className = 'field-head';
    var lab = document.createElement('span'); lab.className = 'lab'; lab.textContent = f.label;
    var reset = document.createElement('button'); reset.type = 'button'; reset.className = 'reset'; reset.textContent = 'Reset';
    head.appendChild(lab); head.appendChild(reset); wrap.appendChild(head);
    var hint = document.createElement('span'); hint.className = 'hint';

    if (f.type === 'image') {
      var row = document.createElement('div'); row.className = 'imgrow';
      var img = document.createElement('img'); img.className = 'thumb'; img.alt = '';
      var file = document.createElement('input'); file.type = 'file'; file.accept = 'image/jpeg,image/png,image/webp'; file.id = 'in-' + f.key;
      row.appendChild(img); row.appendChild(file); wrap.appendChild(row); wrap.appendChild(hint);
      inputs[f.key] = { set: function () { img.src = cur(f.key) || ''; } };
      file.addEventListener('change', function () {
        if (!file.files[0]) return;
        hint.className = 'hint'; hint.textContent = 'Uploading…';
        shrink(file.files[0]).then(function (blob) { return api('/api/upload', blob, { 'Content-Type': blob.type }); })
          .then(function (r) { values[f.key] = r.url; hint.textContent = 'Uploaded. Save to publish.'; hint.className = 'hint good'; refresh(); })
          .catch(function (e) { hint.textContent = e.message; hint.className = 'hint bad'; });
      });
    } else {
      var long = f.type === 'lines' || (defaults[f.key] || '').length > 55;
      var inp = document.createElement(long ? 'textarea' : 'input');
      if (!long) inp.type = 'text';
      if (long) inp.rows = f.type === 'lines' ? 2 : Math.min(6, Math.ceil((defaults[f.key] || '').length / 48));
      inp.id = 'in-' + f.key; inp.setAttribute('aria-label', f.label);
      wrap.appendChild(inp);
      if (f.type === 'video') { inp.placeholder = 'https://www.youtube.com/watch?v=…'; wrap.appendChild(hint); }
      inputs[f.key] = { set: function () { if (document.activeElement !== inp) inp.value = cur(f.key); videoHint(f, inp, hint); } };
      inp.addEventListener('input', function () { values[f.key] = inp.value; videoHint(f, inp, hint); refresh(); });
    }
    reset.addEventListener('click', function () { delete values[f.key]; refresh(true); });
    return wrap;
  }

  function videoHint(f, inp, hint) {
    if (f.type !== 'video') return;
    var v = inp.value.trim();
    if (!v) { hint.className = 'hint'; hint.textContent = 'Empty: the hero shows a dark background.'; return; }
    var m = v.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/) || (/^[\w-]{11}$/.test(v) ? [0, v] : null);
    hint.className = 'hint ' + (m ? 'good' : 'bad');
    hint.textContent = m ? 'Video found (' + m[1] + ').' : 'That doesn’t look like a YouTube link.';
  }

  /* resize before upload so phones' 10 MB photos become ~300 KB */
  function shrink(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var s = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        var type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
        c.toBlob(function (b) { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('Could not read that image.')); }, type, 0.86);
      };
      im.onerror = function () { rej(new Error('Could not read that image.')); };
      im.src = url;
    });
  }

  /* ---- state ---- */
  function effective() {
    var out = {};
    fields.forEach(function (f) {
      var v = values[f.key];
      if (typeof v === 'string' && v !== defaults[f.key] && v.trim() !== '') out[f.key] = v;
    });
    return out;
  }
  function refresh(full) {
    fields.forEach(function (f) {
      var box = document.getElementById('f-' + f.key), v = values[f.key], changed = typeof v === 'string' && v !== defaults[f.key];
      box.classList.toggle('changed', changed);
      if (full || f.type === 'image') inputs[f.key].set(); else if (!box.querySelector(':focus')) inputs[f.key].set();
    });
    [].forEach.call(document.querySelectorAll('details'), function (d) {
      var n = d._fields.filter(function (f) { return document.getElementById('f-' + f.key).classList.contains('changed'); }).length;
      d.querySelector('.n').textContent = n ? n + ' edited' : '';
    });
    var dirty = JSON.stringify(effective()) !== JSON.stringify(saved);
    $('#save').disabled = !dirty;
    var st = $('#status'); st.className = 'status' + (dirty ? ' dirty' : '');
    if (dirty) st.textContent = 'Unsaved changes';
    else if (!st.dataset.msg) st.textContent = 'No changes';
    st.dataset.msg = '';
    pushPreview();
  }
  function pushPreview() {
    try { var w = $('#pv').contentWindow; if (w && w.KnoshApplyContent) w.KnoshApplyContent(effective()); } catch (e) {}
  }
  $('#pv').addEventListener('load', pushPreview);

  $('#save').addEventListener('click', function () {
    var btn = $('#save'), st = $('#status'), eff = effective();
    btn.disabled = true; st.className = 'status'; st.textContent = 'Saving…';
    api('/api/save', JSON.stringify({ values: eff })).then(function () {
      saved = eff; values = JSON.parse(JSON.stringify(eff));
      st.dataset.msg = '1'; refresh(true); st.className = 'status ok'; st.textContent = 'Saved. The live site is updated.';
    }).catch(function (e) { btn.disabled = false; st.className = 'status dirty'; st.textContent = e.message; });
  });

  [].forEach.call(document.querySelectorAll('[data-w]'), function (b) {
    b.addEventListener('click', function () { $('#frame').classList.toggle('phone', b.dataset.w === 'phone'); });
  });
  window.addEventListener('beforeunload', function (e) {
    if (!$('#save').disabled && !$('#app').hidden) { e.preventDefault(); e.returnValue = ''; }
  });
})();
</script>
</body>
</html>
