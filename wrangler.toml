name = "knoshbox"
main = "worker.js"
compatibility_date = "2025-01-01"

# Keep variables set in the Cloudflare dashboard (TURNSTILE_SITE_KEY, NOTIFY_EMAIL, ...) when this repo deploys.
# Without this, a deploy from GitHub would wipe plain-text variables that are not listed here.
keep_vars = true

# The site itself (public/) is served as static assets.
[assets]
directory = "./public"
binding = "ASSETS"

# Where edits and contact-form messages are stored. Wrangler creates this on first deploy.
# If the deploy complains, create a KV namespace in the dashboard and add: id = "<its id>"
[[kv_namespaces]]
binding = "KNOSH"

# Lets the contact form email its messages through Cloudflare itself (no outside account needed).
# Requires Email Routing on knoshbox.com, and the recipient (NOTIFY_EMAIL) verified under
# Email Routing > Destination addresses.
[[send_email]]
name = "EMAIL"
